version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobiserve-backend
    env_file:
      - .env
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://mobiserve:mobiserve@db:5432/mobiserve
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: sh -c "flask --app run db upgrade && flask --app run seed-demo && flask --app run run --host 0.0.0.0 --port 5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobiserve-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    command: npm run dev -- --host 0.0.0.0 --port 5173

  db:
    image: postgres:16-alpine
    container_name: mobiserve-db
    environment:
      POSTGRES_DB: mobiserve
      POSTGRES_USER: mobiserve
      POSTGRES_PASSWORD: mobiserve
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobiserve -d mobiserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mobiserve-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

